version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Moves only together with engines.vscode: vsce refuses to package a newer @types/vscode.
      - dependency-name: "@types/vscode"
      # Majors move by hand, together with the esbuild target in esbuild.mjs (both still say Node 20).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
